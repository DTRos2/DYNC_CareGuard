# ESP32 응급 호출 버튼용 MQTT 브로커 설정. server/app/services/mqtt_listener.py가
# 구독하는 cg/v1/button/{code}/press 토픽을 여기서 중계한다.
#
# allow_anonymous true: ESP32 쪽에 아직 인증서/자격증명을 박아넣는 절차가 없어서
# (체크리스트 범위 밖) 익명 접속을 허용한다 — LAN 내부망 전제. 외부에 노출하는
# 배포라면 이 설정부터 바꿔야 한다.
listener 1883
allow_anonymous true
persistence false
